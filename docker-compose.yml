services:
  # ===============================================================
  # 1. PRAHARI AI Perception & Google Gemini LLM Service
  # ===============================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: prahari-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - BACKEND_URL=http://backend:4000
      - ROBOT_ID=${ROBOT_ID:-PRAHARI-01}
      - ROBOT_CAMERA_STREAM_URL=${ROBOT_CAMERA_STREAM_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_EVENT_COOLDOWN_SECONDS=${GEMINI_EVENT_COOLDOWN_SECONDS:-5}
      - AI_PROCESS_FPS=${AI_PROCESS_FPS:-10.0}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - prahari-network

  # ===============================================================
  # 2. PRAHARI Command Center Backend API & Real-time Socket Engine
  # ===============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prahari-backend
    restart: unless-stopped
    depends_on:
      ai-service:
        condition: service_healthy
      mongodb:
        condition: service_started
    env_file:
      - .env
    environment:
      - PORT=4000
      - BACKEND_PORT=4000
      - BACKEND_URL=http://backend:4000
      - AI_SERVICE_URL=http://ai-service:8000
      - DATABASE_URL=mongodb://mongodb:27017/prahari
      - MONGODB_URI=mongodb://mongodb:27017/prahari
      - ROBOT_ID=${ROBOT_ID:-PRAHARI-01}
      - DEFAULT_ROBOT_ID=${DEFAULT_ROBOT_ID:-PRAHARI-01}
      - ROBOT_API_URL=${ROBOT_API_URL:-http://192.168.4.1:5000}
      - ROBOT_CAMERA_STREAM_URL=${ROBOT_CAMERA_STREAM_URL:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-prahari-image-storage-2026}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - prahari-network

  # ===============================================================
  # 3. PRAHARI Frontend Next.js Command Console
  # ===============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prahari-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:4000
      - NEXT_PUBLIC_ROBOT_CAMERA_STREAM_URL=${ROBOT_CAMERA_STREAM_URL:-}
      - NEXT_PUBLIC_DEMO_MODE=false
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - prahari-network

  # ===============================================================
  # 4. Optional MongoDB Persistence Container
  # ===============================================================
  mongodb:
    image: mongo:7.0
    container_name: prahari-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - prahari-network

volumes:
  mongodb_data:
    driver: local

networks:
  prahari-network:
    driver: bridge
